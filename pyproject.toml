[project]
name = "pslra-tracker"
version = "0.2.0"
description = "Open-source tracker for US securities class actions and PSLRA lead plaintiff deadlines, with an MCP server for Claude."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.8",
    "mcp>=2.0",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
pslra-tracker = "pslra_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pslra_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
